spring:
  application:
    name: pix-flow-backend-test
  datasource:
    url: jdbc:h2:mem:pixflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: 0

pixflow:
  messaging:
    provider: in-memory
    queue-name: test-queue
    queue-url: http://localhost:4566/000000000000/test-queue
  aws:
    region: us-east-1
    endpoint: http://localhost:4566
    access-key-id: test
    secret-access-key: test
  settlement:
    simulation-delay-min-ms: 50
    simulation-delay-max-ms: 100
    failure-threshold-amount: 50000.00
  cors:
    allowed-origins: "*"

