spring:
  application:
    name: pix-flow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pixflow}
    username: ${DB_USER:pixflow}
    password: ${DB_PASSWORD:pixflow_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

pixflow:
  messaging:
    # Options: sqs | in-memory (in-memory allows zero-config deployment on Render Free Tier!)
    provider: ${PIXFLOW_MESSAGING_PROVIDER:in-memory}
    queue-name: ${AWS_SQS_QUEUE_NAME:pix-settlement-queue}
    queue-url: ${AWS_SQS_QUEUE_URL:http://localhost:4566/000000000000/pix-settlement-queue}
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    access-key-id: ${AWS_ACCESS_KEY_ID:mock-key}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:mock-secret}
  settlement:
    simulation-delay-min-ms: 800
    simulation-delay-max-ms: 2200
    failure-threshold-amount: 50000.00
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}

