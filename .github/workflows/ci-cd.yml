name: PixFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Build, Test & JaCoCo Coverage Enforcement (>=80%)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permissions to Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Execute Maven Tests & JaCoCo Coverage Check
        working-directory: ./backend
        run: ./mvnw clean verify -B

      - name: Upload JaCoCo Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 2. Frontend Build & Static Asset Verification
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production SPA Bundle
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Terraform Validation & Format Check
  # ----------------------------------------------------------------------------
  terraform-validate:
    name: Terraform IaC Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Check Terraform Formatting
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        working-directory: ./terraform
        run: terraform validate

  # ----------------------------------------------------------------------------
  # 4. Multi-Stage Container Packaging & Verification
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Release Packaging
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, terraform-validate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pixflow-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: pixflow-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

